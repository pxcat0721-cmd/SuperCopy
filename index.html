<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SuperCopy - 智能文本复制工具</title>
<style>
  :root {
    --bg: #0f0f0f;
    --surface: #1a1a1a;
    --surface2: #222;
    --border: #2a2a2a;
    --text: #e0e0e0;
    --text2: #999;
    --accent: #6c5ce7;
    --accent2: #a29bfe;
    --danger: #e74c3c;
    --danger2: #c0392b;
    --green: #2ecc71;
    --green2: #27ae60;
    --orange: #f39c12;
    --radius: 12px;
    --transition: 0.2s ease;
    --shadow-color: rgba(0,0,0,0.5);
    --hover-overlay: rgba(255,255,255,0.04);
  }

  [data-theme="light"] {
    --bg: #f5f5f5;
    --surface: #ffffff;
    --surface2: #f0f0f0;
    --border: #e0e0e0;
    --text: #1a1a1a;
    --text2: #777;
    --accent: #6c5ce7;
    --accent2: #5b4cdb;
    --shadow-color: rgba(0,0,0,0.1);
    --hover-overlay: rgba(0,0,0,0.04);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans SC", sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    padding: 16px 20px;
    transition: background 0.35s ease, color 0.35s ease;
  }

  body * {
    transition: background 0.25s ease, border-color 0.25s ease, color 0.25s ease, box-shadow 0.25s ease;
  }

  /* 背景装饰 */
  body::before {
    content: '';
    position: fixed;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background:
      radial-gradient(ellipse at 20% 50%, rgba(108, 92, 231, 0.08) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 20%, rgba(162, 155, 254, 0.06) 0%, transparent 50%),
      radial-gradient(ellipse at 50% 80%, rgba(46, 204, 113, 0.04) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 1400px;
    height: 100%;
    display: flex;
    flex-direction: column;
    gap: 16px;
    padding-top: 50px;
  }

  /* Header */
  .top-bar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    background: linear-gradient(to bottom, var(--bg) 60%, transparent);
    pointer-events: none;
  }

  .top-bar > * {
    pointer-events: auto;
  }

  .logo-fixed {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.5px;
    color: var(--accent2);
  }

  /* Two-column layout */
  .columns {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
    flex: 1;
    min-height: 0;
  }

  /* Card */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    transition: border-color var(--transition);
    display: flex;
    flex-direction: column;
    min-height: 0;
    overflow: hidden;
  }

  .card:focus-within {
    border-color: var(--accent);
  }

  .card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
    flex-shrink: 0;
  }

  .card-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--text2);
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  /* Textarea */
  textarea {
    width: 100%;
    min-height: 0;
    flex: 1;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: "SF Mono", "Fira Code", "Cascadia Code", Consolas, monospace;
    font-size: 14px;
    line-height: 1.7;
    padding: 16px;
    resize: vertical;
    outline: none;
    transition: border-color var(--transition), box-shadow var(--transition);
  }

  textarea:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(108, 92, 231, 0.15);
  }

  textarea::placeholder {
    color: var(--text2);
    opacity: 0.6;
  }

  /* Stats bar */
  .stats {
    display: flex;
    gap: 20px;
    margin-top: 12px;
    font-size: 13px;
    color: var(--text2);
  }

  .stat {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .stat-value {
    color: var(--accent2);
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  /* === Sidebar + Main Layout === */
  .main-layout {
    display: flex;
    gap: 20px;
    align-items: stretch;
    flex: 1;
    min-height: 0;
  }

  /* === Sidebar Menu === */
  .sidebar {
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-width: 180px;
    max-width: 200px;
    flex-shrink: 0;
    min-height: 0;
    overflow-y: auto;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px;
  }

  .sidebar-section {
    font-size: 10px;
    font-weight: 700;
    color: var(--text2);
    text-transform: uppercase;
    letter-spacing: 1.5px;
    padding: 6px 8px 4px;
    margin-top: 4px;
  }

  .sidebar-section:first-child {
    margin-top: 0;
  }

  .sidebar-item {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    padding: 7px 10px;
    background: transparent;
    border: none;
    border-radius: 6px;
    color: var(--text2);
    font-size: 12px;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.12s ease;
    text-align: left;
    white-space: nowrap;
  }

  .sidebar-item:hover {
    background: var(--surface2);
    color: var(--text);
  }

  .sidebar-item.active {
    color: var(--accent2);
    background: rgba(108, 92, 231, 0.12);
  }

  .sidebar-item .item-icon {
    font-size: 14px;
    width: 18px;
    text-align: center;
    flex-shrink: 0;
  }

  .sidebar-item .item-label {
    flex: 1;
  }

  .sidebar-item .item-check {
    font-size: 12px;
    color: var(--accent2);
    visibility: hidden;
    flex-shrink: 0;
  }

  .sidebar-item.active .item-check {
    visibility: visible;
  }

  .sidebar-divider {
    height: 1px;
    background: var(--border);
    margin: 6px 8px;
  }

  /* === Main content area === */
  .main-content {
    flex: 1;
    min-width: 0;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }
  .theme-toggle {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
    cursor: pointer;
    transition: all var(--transition);
    user-select: none;
  }

  .theme-toggle:hover {
    border-color: var(--text2);
    background: var(--surface2);
  }

  .theme-toggle .toggle-icon {
    font-size: 16px;
    line-height: 1;
  }

  /* Actions */
  .actions {
    display: flex;
    gap: 12px;
    margin-top: 16px;
    flex-wrap: wrap;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 12px 24px;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all var(--transition);
    font-family: inherit;
  }

  .btn-primary {
    background: linear-gradient(135deg, var(--accent), #5b4cdb);
    color: #fff;
  }

  .btn-primary:hover {
    transform: translateY(-1px);
    box-shadow: 0 4px 20px rgba(108, 92, 231, 0.35);
  }

  .btn-primary:active {
    transform: translateY(0);
  }

  .btn-secondary {
    background: var(--surface2);
    color: var(--text);
    border: 1px solid var(--border);
  }

  .btn-secondary:hover {
    border-color: #aaa;
    background: var(--surface2);
  }

  .btn-danger {
    background: transparent;
    color: var(--danger);
    border: 1px solid transparent;
  }

  .btn-danger:hover {
    background: rgba(231, 76, 60, 0.1);
    border-color: rgba(231, 76, 60, 0.3);
  }

  .btn-copy {
    background: linear-gradient(135deg, var(--green), var(--green2));
    color: #fff;
  }

  .btn-copy:hover {
    transform: translateY(-1px);
    box-shadow: 0 4px 20px rgba(46, 204, 113, 0.35);
  }

  .btn-copy.copied {
    background: linear-gradient(135deg, #27ae60, #1e8449);
  }

  .btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    pointer-events: none;
  }

  /* Diff highlight */
  .removed-preview {
    margin-top: 16px;
    padding: 12px 16px;
    background: rgba(231, 76, 60, 0.08);
    border: 1px solid rgba(231, 76, 60, 0.2);
    border-radius: 8px;
    display: none;
  }

  .removed-preview.visible {
    display: block;
  }

  .removed-preview .title {
    font-size: 12px;
    color: var(--danger);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 6px;
  }

  .removed-preview .content {
    font-family: "SF Mono", "Fira Code", monospace;
    font-size: 13px;
    color: #999;
    word-break: break-all;
    max-height: 60px;
    overflow-y: auto;
  }

  /* Toast */
  .toast {
    position: fixed;
    top: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(-120px);
    background: var(--surface);
    border: 1px solid var(--green);
    color: var(--green);
    padding: 12px 24px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    z-index: 100;
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    pointer-events: none;
  }

  .toast.show {
    transform: translateX(-50%) translateY(0);
  }

  /* Responsive */
  @media (max-width: 1100px) {
    body { height: auto; overflow: auto; }
    .container { height: auto; padding-top: 40px; }
    .top-bar { padding: 8px 12px; gap: 8px; }
    .logo-fixed { font-size: 16px; }
    .main-layout { flex-direction: column; flex: none; }
    .sidebar {
      flex-direction: row;
      flex-wrap: wrap;
      min-width: auto;
      max-width: none;
      gap: 6px;
      padding: 10px 12px;
    }
    .sidebar-section { width: 100%; padding: 2px 4px; }
    .sidebar-divider { display: none; }
    .sidebar-item { width: auto; padding: 6px 10px; font-size: 12px; }
    .columns { flex: none; }
    .card { min-height: 0; overflow: visible; }
    textarea { min-height: 200px; flex: none; }
  }

  @media (max-width: 768px) {
    .columns { grid-template-columns: 1fr; }
  }

  @media (max-width: 600px) {
    body { padding: 12px; }
    .sidebar { padding: 8px; gap: 4px; }
    .sidebar-item { padding: 5px 8px; font-size: 11px; }
    .actions { flex-direction: column; }
    .btn { justify-content: center; }
    textarea { min-height: 150px; }
    .top-bar { padding: 8px 12px; gap: 6px; }
    .logo-fixed { font-size: 16px; }
    .theme-toggle { font-size: 11px; padding: 4px 8px; }
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #888; border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: #666; }

  [data-theme="light"] ::-webkit-scrollbar-thumb { background: #ccc; }
  [data-theme="light"] ::-webkit-scrollbar-thumb:hover { background: #aaa; }
</style>
</head>
<body>

<div class="top-bar">
  <span class="logo-fixed">SuperCopy</span>
  <button class="theme-toggle" id="themeToggle" title="切换亮色/暗色主题">
    <span class="toggle-icon">☀</span>
    <span>亮色</span>
  </button>
</div>

<div class="container">

  <div class="main-layout">

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-section">文本过滤</div>
    <button class="sidebar-item" data-filter="chinese">
      <span class="item-icon">字</span>
      <span class="item-label">去除中文</span>
      <span class="item-check">✓</span>
    </button>
    <button class="sidebar-item" data-filter="emoji">
      <span class="item-icon">:)</span>
      <span class="item-label">去除 Emoji</span>
      <span class="item-check">✓</span>
    </button>
    <button class="sidebar-item" data-filter="numbers">
      <span class="item-icon">#</span>
      <span class="item-label">去除数字</span>
      <span class="item-check">✓</span>
    </button>
    <button class="sidebar-item" data-filter="punctuation">
      <span class="item-icon">~</span>
      <span class="item-label">去除标点</span>
      <span class="item-check">✓</span>
    </button>
    <button class="sidebar-item" data-filter="whitespace">
      <span class="item-icon">␣</span>
      <span class="item-label">压缩空格</span>
      <span class="item-check">✓</span>
    </button>
    <button class="sidebar-item" data-filter="special">
      <span class="item-icon">※</span>
      <span class="item-label">去除特殊符号</span>
      <span class="item-check">✓</span>
    </button>
    <button class="sidebar-item" data-filter="weibo">
      <span class="item-icon">@</span>
      <span class="item-label">去除微博格式</span>
      <span class="item-check">✓</span>
    </button>

    <div class="sidebar-divider"></div>
    <div class="sidebar-section">链接处理</div>
    <button class="sidebar-item" data-filter="tracking">
      <span class="item-icon">&amp;</span>
      <span class="item-label">去除追踪标记</span>
      <span class="item-check">✓</span>
    </button>
    <button class="sidebar-item" data-filter="expand">
      <span class="item-icon">&#187;</span>
      <span class="item-label">展开短链</span>
      <span class="item-check">✓</span>
    </button>
    <button class="sidebar-item" data-filter="extracturl">
      <span class="item-icon">&#9632;</span>
      <span class="item-label">口令提取</span>
      <span class="item-check">✓</span>
    </button>
    <button class="sidebar-item" data-filter="bvav">
      <span class="item-icon">&#8660;</span>
      <span class="item-label">BV⇄AV 互转</span>
      <span class="item-check">✓</span>
    </button>
    <button class="sidebar-item" data-filter="urldecode">
      <span class="item-icon">%</span>
      <span class="item-label">URL 解码</span>
      <span class="item-check">✓</span>
    </button>
  </aside>

  <!-- Main content -->
  <div class="main-content">

  <div class="columns">

  <!-- Input -->
  <div class="card">
    <div class="card-header">
      <span class="card-title">输入文本</span>
      <button class="btn btn-danger" id="clearBtn" style="padding: 6px 12px; font-size: 12px;">清空</button>
    </div>
    <textarea
      id="input"
      placeholder="在此粘贴你的文本...&#10;&#10;支持快捷键：&#10;  Ctrl+V  粘贴&#10;  Ctrl+A  全选"
    ></textarea>
    <div class="stats">
      <div class="stat">字符 <span class="stat-value" id="inputChars">0</span></div>
      <div class="stat">单词 <span class="stat-value" id="inputWords">0</span></div>
      <div class="stat">行 <span class="stat-value" id="inputLines">0</span></div>
      <div class="stat" id="chineseCountStat" style="display:none;">中文 <span class="stat-value" id="chineseCount">0</span></div>
      <div class="stat" id="emojiCountStat" style="display:none;">Emoji <span class="stat-value" id="emojiCount">0</span></div>
    </div>
  </div>

  <!-- Output -->
  <div class="card">
    <div class="card-header">
      <span class="card-title">处理后文本</span>
      <span style="font-size: 12px; color: var(--text2);" id="diffInfo"></span>
    </div>
    <textarea
      id="output"
      placeholder="处理后的文本将显示在这里..."
      readonly
    ></textarea>
    <div class="stats">
      <div class="stat">字符 <span class="stat-value" id="outputChars">0</span></div>
      <div class="stat">单词 <span class="stat-value" id="outputWords">0</span></div>
      <div class="stat">行 <span class="stat-value" id="outputLines">0</span></div>
      <div class="stat" id="diffCountStat"><span id="diffLabel">已去除</span> <span class="stat-value" id="removedCount">0</span> 个字符</div>
    </div>

    <!-- Removed content preview -->
    <div class="removed-preview" id="removedPreview">
      <div class="title">被去除的内容</div>
      <div class="content" id="removedContent"></div>
    </div>

    <div class="actions">
      <button class="btn btn-copy" id="copyBtn">
        复制结果
      </button>
      <button class="btn btn-secondary" id="pasteBtn">
        从剪贴板粘贴
      </button>
      <button class="btn btn-secondary" id="swapBtn">
        设为输入
      </button>
    </div>
  </div>

  </div><!-- /columns -->

  </div><!-- /main-content -->

  </div><!-- /main-layout -->

</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script src="tracking-rules.js"></script>
<script>
(function() {
  // --- DOM ---
  const $input    = document.getElementById('input');
  const $output   = document.getElementById('output');
  const $sidebar  = document.getElementById('sidebar');
  const $copyBtn  = document.getElementById('copyBtn');
  const $clearBtn = document.getElementById('clearBtn');
  const $pasteBtn = document.getElementById('pasteBtn');
  const $swapBtn  = document.getElementById('swapBtn');
  const $toast    = document.getElementById('toast');
  const $removedPreview = document.getElementById('removedPreview');
  const $removedContent = document.getElementById('removedContent');
  const $diffInfo = document.getElementById('diffInfo');

  const $inputChars  = document.getElementById('inputChars');
  const $inputWords  = document.getElementById('inputWords');
  const $inputLines  = document.getElementById('inputLines');
  const $outputChars = document.getElementById('outputChars');
  const $outputWords = document.getElementById('outputWords');
  const $outputLines = document.getElementById('outputLines');
  const $removedCount= document.getElementById('removedCount');
  const $diffLabel  = document.getElementById('diffLabel');
  const $diffCountStat = document.getElementById('diffCountStat');
  const $chineseCount= document.getElementById('chineseCount');
  const $chineseCountStat = document.getElementById('chineseCountStat');
  const $emojiCount  = document.getElementById('emojiCount');
  const $emojiCountStat = document.getElementById('emojiCountStat');

  // --- State ---
  const allSidebarItems = [...$sidebar.querySelectorAll('.sidebar-item')];
  const activeFilters = new Set(
    allSidebarItems.filter(b => b.classList.contains('active')).map(b => b.dataset.filter)
  );

  // --- Regex patterns ---
  const PATTERNS = {
    chinese:     /[\u4e00-\u9fff\u3400-\u4dbf\uf900-\ufaff\u3000-\u303f\uff00-\uffef\u2e80-\u2eff\u31c0-\u31ef\u3200-\u32ff\u3300-\u33ff\ufe10-\ufe1f\ufe30-\ufe4f]/g,
    emoji:       /[\u{1F600}-\u{1F64F}\u{1F300}-\u{1F5FF}\u{1F680}-\u{1F6FF}\u{1F1E0}-\u{1F1FF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}\u{1F900}-\u{1F9FF}\u{1FA00}-\u{1FA6F}\u{1FA70}-\u{1FAFF}\u{2300}-\u{23FF}\u{2B50}\u{2B55}\u{2934}\u{2935}\u{25AA}\u{25AB}\u{25B6}\u{25C0}\u{25FB}-\u{25FE}\u{200D}\u{FE0F}\u{20E3}\u{1F004}\u{1F0CF}\u{1F18E}]/gu,
    numbers:     /\d+/g,
    punctuation: /[\p{P}\p{S}]/gu,
    whitespace:  /\s{2,}/g,
    special:     /[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?`~]/g,
    weibo:       /\[(?:\/?cp|图片|表情|视频|链接|语音|音乐|投票)\]/g,
  };

  // Tracking rules loaded from tracking-rules.js → exposes TrackingRules.strip(text)

  // --- Bilibili BV ↔ AV conversion ---
  const BV_TABLE = 'fZodR9XQDSUm21yCkr6zBqiveYah8bt4xsWpHnJE7jL5VG3guMTKNPAwcF';
  const BV_S = [11, 10, 3, 8, 4, 6];       // positions of encoded chars in BV string
  const BV_XOR = 177451812;
  const BV_ADD = 8728348608;
  const BV_TEMPLATE = [...'BV1  4 1 7  ']; // template for AV→BV conversion

  function bvToAv(bv) {
    let sum = 0;
    for (let i = 0; i < 6; i++) {
      const idx = BV_TABLE.indexOf(bv[BV_S[i]]);
      if (idx === -1) return null;
      sum += idx * Math.pow(58, i);
    }
    const av = (sum - BV_ADD) ^ BV_XOR;
    if (av <= 0) return null;
    return 'av' + av;
  }

  function avToBv(av) {
    const num = parseInt(av.replace(/av/i, ''));
    if (isNaN(num) || num <= 0) return null;
    let n = (num ^ BV_XOR) + BV_ADD;
    const result = [...BV_TEMPLATE];
    for (let i = 0; i < 6; i++) {
      result[BV_S[i]] = BV_TABLE[Math.floor(n / Math.pow(58, i)) % 58];
    }
    return result.join('');
  }

  function convertBvAv(text) {
    const convertedFromBv = new Set();
    // BV → AV
    let result = text.replace(/BV1[a-zA-Z0-9]{9}/gi, m => {
      if (m.length !== 12) return m;
      const av = bvToAv(m);
      if (av) convertedFromBv.add(av.toLowerCase());
      return av || m;
    });
    // AV → BV (skip AV codes we just created from BV conversion)
    result = result.replace(/\bav(\d+)\b/gi, m => {
      if (convertedFromBv.has(m.toLowerCase())) return m;
      const bv = avToBv(m);
      return bv || m;
    });
    return result;
  }

  const FILTER_LABELS = {
    chinese:     '中文',
    emoji:       'Emoji',
    numbers:     '数字',
    punctuation: '标点',
    whitespace:  '多余空格',
    special:     '特殊符号',
    tracking:    '追踪参数',
    expand:      '展开短链',
    bvav:        'BV⇄AV',
    extracturl:  '口令提取',
    urldecode:   'URL解码',
    weibo:       '微博格式',
  };

  // --- Sidebar: item clicks (toggle filter) ---
  $sidebar.addEventListener('click', e => {
    const item = e.target.closest('.sidebar-item');
    if (!item) return;
    const key = item.dataset.filter;
    if (activeFilters.has(key)) {
      activeFilters.delete(key);
      item.classList.remove('active');
    } else {
      activeFilters.add(key);
      item.classList.add('active');
    }
    process();
  });

  // --- Input typing ---
  let debounceTimer;
  $input.addEventListener('input', () => {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(process, 150);
  });

  // --- Expand short links by calling local server API ---
  // Matches all URLs; the server follows redirects and returns the final URL.
  // Non-short URLs just resolve to themselves (no-op).
  const URL_REGEX = /(?:https?:\/\/|https?%3A%2F%2F)[^\s<>^`\[\]]+/gi;

  async function expandShortUrls(text) {
    const matches = text.match(URL_REGEX);
    if (!matches) return { text, blockedUrls: [] };

    // Convert expanded URL to PC format where applicable
    function normalizeUrl(url) {
      // xhslink.cn → xiaohongshu.com: /discovery/item/ → /explore/
      const m = url.match(/^(https?:\/\/www\.xiaohongshu\.com)\/discovery\/item\/([a-f0-9]+)(\?.*)?$/i);
      if (m) {
        return m[1] + '/explore/' + m[2] + (m[3] || '');
      }
      return url;
    }

    // Deduplicate URLs to avoid redundant API calls
    const uniqueUrls = [...new Set(matches)];

    // Expand with limited concurrency (2 at a time) to avoid overwhelming server
    const expansions = [];
    const blockedUrls = [];  // Track URLs blocked by anti-bot
    for (let i = 0; i < uniqueUrls.length; i += 2) {
      const batch = uniqueUrls.slice(i, i + 2);
      const results = await Promise.all(batch.map(async (u) => {
        try {
          const apiUrl = '/expand?url=' + encodeURIComponent(u);
          const resp = await fetch(apiUrl, { signal: AbortSignal.timeout(15000) });
          if (resp.ok) {
            const data = await resp.json();
            if (data.expanded && data.expanded !== u) {
              return { from: u, to: normalizeUrl(data.expanded) };
            }
            // Server returned same URL — check if it was blocked
            if (data.note && data.note.toLowerCase().includes('block')) {
              blockedUrls.push(u);
            }
          }
        } catch (e) {
          console.warn('短链展开失败:', u, e.message);
        }
        return null;
      }));
      expansions.push(...results);
    }

    let result = text;
    for (const e of expansions) {
      if (e) result = result.replace(e.from, e.to);
    }

    // Append blocked warning only when nothing was expanded at all
    if (blockedUrls.length > 0 && expansions.length === 0) {
      result = result.trim();
      if (result) result += '\n\n';
      result += '⚠ 以下短链因反爬验证未能展开（请手动在浏览器中打开）：\n' + blockedUrls.join('\n');
    }

    return { text: result, blockedUrls };
  }

  // --- Process ---
  async function process() {
    const raw = $input.value;
    let result = raw;
    const removedParts = [];

    // Enforce processing order: extracturl → expand → tracking
    const orderedKeys = [...activeFilters];
    const orderPriority = ['extracturl', 'expand', 'tracking'];
    // Move these three to the front in priority order, keeping others stable
    for (let p = orderPriority.length - 1; p >= 0; p--) {
      const key = orderPriority[p];
      const idx = orderedKeys.indexOf(key);
      if (idx > -1) {
        orderedKeys.splice(idx, 1);
        orderedKeys.unshift(key);
      }
    }
    // Now the first items are extracturl, expand, tracking (if present) in order

    for (const key of orderedKeys) {
      if (key === 'urldecode') continue;
      if (key === 'whitespace') {
        // Special: compress whitespace instead of remove
        const before = result;
        result = result.replace(PATTERNS.whitespace, ' ');
        result = result.replace(/^\s+|\s+$/g, ''); // trim as well
        if (before !== result) {
          removedParts.push('多余空格');
        }
      } else if (key === 'extracturl') {
        // Extract URLs from share phrases (抖音口令 etc.)
        const urlRegex = /(?:https?:\/\/|https?%3A%2F%2F|www\.|[a-z0-9][-a-z0-9]*\.[a-z]{2,}\/)[^\s<>^`\[\]]+/gi;
        const urls = result.match(urlRegex);
        if (urls && urls.length > 0) {
          result = [...new Set(urls)].join('\n');
          removedParts.push(`[口令提取: ${urls.length} 个链接]`);
        }
      } else if (key === 'expand') {
        // Expand short links (b23.tv etc.)
        const before = result;
        const expandResult = await expandShortUrls(result);
        result = expandResult.text;
        if (before !== result) {
          removedParts.push('[短链已展开]');
        }
        if (expandResult.blockedUrls.length > 0) {
          removedParts.push(`[反爬拦截: ${expandResult.blockedUrls.length} 条短链未能展开]`);
        }
      } else if (key === 'bvav') {
        // Bilibili BV ↔ AV conversion
        const before = result;
        result = convertBvAv(result);
        if (before !== result) {
          removedParts.push('[BV⇄AV 已转换]');
        }
      } else if (key === 'tracking') {
        // Strip tracking params from URLs
        const before = result;
        result = TrackingRules.strip(result);
        if (before !== result) {
          const strippedCount = before.length - result.length;
          removedParts.push(`[追踪参数: 去除 ${strippedCount} 个字符]`);
        }
      } else {
        const pattern = PATTERNS[key];
        if (!pattern) continue;

        // Collect removed content for preview
        const matches = result.match(pattern);
        if (matches && matches.length > 0) {
          const removedStr = matches.join('').slice(0, 50);
          removedParts.push(`[${FILTER_LABELS[key]}: ${removedStr}${matches.join('').length > 50 ? '...' : ''}]`);
        }

        result = result.replace(pattern, '');
      }
    }

    // Remove blank lines (optional cleanup)
    if (activeFilters.has('whitespace')) {
      result = result.replace(/\n{3,}/g, '\n\n');
    }

    // URL decode runs LAST — after tracking params are already stripped,
    // so it won't break the query string structure
    if (activeFilters.has('urldecode')) {
      const before = result;
      result = urlDecodeText(result);
      if (before !== result) {
        removedParts.push('[URL解码]');
      }
    }

    $output.value = result;

    // Stats
    updateStats(raw, result);
    updateRemovedPreview(raw, result, removedParts);

    // Diff info
    if (raw !== result) {
      const delta = result.length - raw.length;
      const verb = delta > 0 ? '增加了' : '减少了';
      $diffInfo.textContent = `${verb} ${Math.abs(delta)} 个字符`;
      $diffInfo.style.color = delta > 0 ? 'var(--orange)' : 'var(--green)';
    } else {
      $diffInfo.textContent = '';
    }
  }

  // --- URL decode: convert %xx sequences to normal characters ---
  // Handles double-encoded URLs (e.g. %253A → %3A → : after repeated decoding)
  function urlDecodeText(text) {
    try {
      let prev = text;
      // Decode up to 3 times to handle double/triple encoding
      for (let i = 0; i < 3; i++) {
        let decoded;
        try {
          decoded = decodeURIComponent(prev);
        } catch {
          // If full decode fails, try replacing only valid %xx sequences
          decoded = prev.replace(/%[0-9A-Fa-f]{2}/g, m => {
            try { return decodeURIComponent(m); } catch { return m; }
          });
        }
        if (decoded === prev) break;
        prev = decoded;
      }
      return prev;
    } catch {
      return text;
    }
  }

  function updateStats(raw, result) {
    $inputChars.textContent = raw.length;
    $inputWords.textContent = raw.trim() ? raw.trim().split(/\s+/).length : 0;
    $inputLines.textContent = raw ? raw.split('\n').length : 0;

    $outputChars.textContent = result.length;
    $outputWords.textContent = result.trim() ? result.trim().split(/\s+/).length : 0;
    $outputLines.textContent = result ? result.split('\n').length : 0;

    const diff = result.length - raw.length;
    if (diff > 0) {
      $removedCount.textContent = '+' + diff;
      $diffLabel.textContent = '已增加';
      $diffCountStat.style.color = 'var(--orange)';
      $removedCount.style.color = 'var(--orange)';
    } else if (diff < 0) {
      $removedCount.textContent = Math.abs(diff);
      $diffLabel.textContent = '已去除';
      $diffCountStat.style.color = 'var(--green)';
      $removedCount.style.color = 'var(--green)';
    } else {
      $removedCount.textContent = '0';
      $diffLabel.textContent = '已去除';
      $diffCountStat.style.color = 'var(--green)';
      $removedCount.style.color = 'var(--green)';
    }

    // Chinese char count
    const chineseMatches = raw.match(PATTERNS.chinese);
    if (chineseMatches && chineseMatches.length > 0) {
      $chineseCount.textContent = chineseMatches.join('').length;
      $chineseCountStat.style.display = '';
    } else {
      $chineseCountStat.style.display = 'none';
    }

    // Emoji count
    const emojiMatches = raw.match(PATTERNS.emoji);
    if (emojiMatches && emojiMatches.length > 0) {
      $emojiCount.textContent = emojiMatches.join('').length;
      $emojiCountStat.style.display = '';
    } else {
      $emojiCountStat.style.display = 'none';
    }
  }

  function updateRemovedPreview(raw, result, removedParts) {
    if (raw === result || removedParts.length === 0) {
      $removedPreview.classList.remove('visible');
      return;
    }
    $removedPreview.classList.add('visible');
    $removedContent.textContent = removedParts.join('  ');
  }

  // --- Copy ---
  $copyBtn.addEventListener('click', async () => {
    const text = $output.value;
    if (!text) {
      showToast('! 没有可复制的内容', 'warning');
      return;
    }
    try {
      await navigator.clipboard.writeText(text);
      $copyBtn.classList.add('copied');
      $copyBtn.innerHTML = '<span>✓</span> 已复制!';
      showToast('✓ 已复制到剪贴板');
      setTimeout(() => {
        $copyBtn.classList.remove('copied');
        $copyBtn.innerHTML = '复制结果';
      }, 2000);
    } catch {
      // Fallback
      $output.select();
      document.execCommand('copy');
      showToast('✓ 已复制到剪贴板');
      setTimeout(() => {
        $copyBtn.classList.remove('copied');
        $copyBtn.innerHTML = '复制结果';
      }, 2000);
    }
  });

  // --- Paste ---
  $pasteBtn.addEventListener('click', async () => {
    try {
      const text = await navigator.clipboard.readText();
      if (text) {
        $input.value = text;
        process();
        showToast('已从剪贴板粘贴');
      }
    } catch {
      showToast('! 无法读取剪贴板，请手动粘贴', 'warning');
    }
  });

  // --- Swap (set output as input) ---
  $swapBtn.addEventListener('click', () => {
    if (!$output.value.trim()) return;
    $input.value = $output.value;
    process();
    showToast('已将处理结果设为输入');
  });

  // --- Clear ---
  $clearBtn.addEventListener('click', () => {
    $input.value = '';
    $output.value = '';
    process();
    showToast('已清空');
  });

  // --- Toast ---
  let toastTimer;
  function showToast(msg, type) {
    clearTimeout(toastTimer);
    $toast.textContent = msg;
    $toast.className = 'toast show';
    if (type === 'warning') {
      $toast.style.borderColor = 'var(--orange)';
      $toast.style.color = 'var(--orange)';
    } else {
      $toast.style.borderColor = 'var(--green)';
      $toast.style.color = 'var(--green)';
    }
    toastTimer = setTimeout(() => {
      $toast.classList.remove('show');
    }, 2000);
  }

  // --- Keyboard shortcuts ---
  document.addEventListener('keydown', e => {
    // Ctrl+Shift+V to paste from clipboard
    if (e.ctrlKey && e.shiftKey && e.key === 'V') {
      e.preventDefault();
      $pasteBtn.click();
    }
    // Ctrl+Shift+C to copy result
    if (e.ctrlKey && e.shiftKey && e.key === 'C') {
      e.preventDefault();
      $copyBtn.click();
    }
  });

  // --- Theme toggle ---
  const themeToggle = document.getElementById('themeToggle');
  const STORAGE_KEY = 'supercopy-theme';

  function setTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    localStorage.setItem(STORAGE_KEY, theme);
    const icon = themeToggle.querySelector('.toggle-icon');
    const label = themeToggle.querySelector('span:last-child');
    if (theme === 'light') {
      icon.textContent = '☾';
      label.textContent = '暗色';
    } else {
      icon.textContent = '☀';
      label.textContent = '亮色';
    }
  }

  // Load saved theme
  const savedTheme = localStorage.getItem(STORAGE_KEY) || 'dark';
  setTheme(savedTheme);

  themeToggle.addEventListener('click', () => {
    const current = document.documentElement.getAttribute('data-theme') || 'dark';
    setTheme(current === 'light' ? 'dark' : 'light');
  });

  // --- Initial process ---
  process();
})();
</script>
</body>
</html>
