<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SuperCopy - 智能文本复制工具</title>
<style>
  :root {
    --bg: #f7f6f3;
    --surface: #ffffff;
    --surface2: #f0efe9;
    --border: #e7e5de;
    --border2: #f0efe9;
    --text: #1a1915;
    --text2: #8a887f;
    --text3: #b3b1a7;
    --accent: #1a1915;
    --accent-fg: #ffffff;
    --track-off: #dddbd2;
    --del-fg: #a8493f;
    --del-bg: #f6e7e4;
    --ins-fg: #3f6b34;
    --ins-bg: #e9f0e4;
    --green: #4a8a3f;
    --orange: #b0762f;
    --shadow: 0 2px 8px -4px rgba(26,25,21,0.08);
  }

  [data-theme="dark"] {
    --bg: #141412;
    --surface: #1d1c1a;
    --surface2: #262523;
    --border: #2e2d2a;
    --border2: #262523;
    --text: #e8e6e0;
    --text2: #8f8d84;
    --text3: #5f5d55;
    --accent: #e8e6e0;
    --accent-fg: #1a1915;
    --track-off: #3a3936;
    --del-fg: #d08376;
    --del-bg: rgba(200, 90, 70, 0.16);
    --ins-fg: #8fbf7f;
    --ins-bg: rgba(120, 180, 90, 0.14);
    --green: #7fae72;
    --orange: #c99a5e;
    --shadow: 0 2px 8px -4px rgba(0,0,0,0.4);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
    transition: background 0.3s ease, color 0.3s ease;
  }

  body * {
    transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease;
  }

  .mono { font-family: "SF Mono", ui-monospace, Menlo, Consolas, monospace; }

  .app {
    max-width: 1400px;
    height: 100%;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    padding: 0 24px;
  }

  /* ===== Header ===== */
  .hd {
    display: flex;
    align-items: baseline;
    gap: 14px;
    padding: 18px 0 14px;
    flex-shrink: 0;
  }

  .logo { font-size: 17px; font-weight: 800; letter-spacing: -0.4px; }

  .tagline { font-size: 11.5px; color: var(--text2); }

  .spacer { flex: 1; }

  .hlink {
    font-size: 11px;
    color: var(--text2);
    background: none;
    border: none;
    font-family: inherit;
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 3px;
    text-decoration-color: var(--text3);
    padding: 2px;
    white-space: nowrap;
  }

  #themeToggle { font-size: 12px; }

  .hlink:hover { color: var(--text); }

  a { color: var(--text); text-underline-offset: 3px; }
  a:hover { color: var(--text2); }

  /* ===== Layout ===== */
  .main {
    display: flex;
    gap: 14px;
    flex: 1;
    min-height: 0;
    padding-bottom: 20px;
  }

  /* ===== Sidebar ===== */
  aside {
    width: 196px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-height: 0;
    overflow-y: auto;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
  }

  .group { overflow: hidden; flex-shrink: 0; }

  .group-hd {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    padding: 9px 12px;
    background: none;
    border: none;
    border-bottom: 1px solid var(--border2);
    font-family: inherit;
    font-size: 11.5px;
    font-weight: 700;
    color: var(--text);
    cursor: pointer;
    text-align: left;
  }

  .group-meta {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 10px;
    font-weight: 400;
    color: var(--text2);
  }

  .group-meta .chev {
    display: inline-block;
    transition: transform 0.2s ease;
    font-size: 9px;
    color: var(--text3);
  }

  .group.collapsed .group-hd { border-bottom-color: transparent; }
  .group.collapsed .chev { transform: rotate(-90deg); }

  .group-body {
    padding: 6px;
    display: flex;
    flex-direction: column;
    gap: 1px;
  }

  .group.collapsed .group-body { display: none; }

  .frow {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 5px 8px;
    border: none;
    border-radius: 6px;
    background: none;
    font-family: inherit;
    font-size: 12px;
    color: var(--text2);
    cursor: pointer;
    text-align: left;
    white-space: nowrap;
  }

  .frow:hover { background: var(--surface2); }
  .frow.on { color: var(--text); }

  .switch {
    width: 26px;
    height: 15px;
    border-radius: 8px;
    background: var(--track-off);
    position: relative;
    flex-shrink: 0;
    transition: background 0.2s ease;
  }

  .switch::after {
    content: '';
    position: absolute;
    top: 2px;
    left: 2px;
    width: 11px;
    height: 11px;
    border-radius: 6px;
    background: #fff;
    transition: transform 0.2s ease;
  }

  [data-theme="dark"] .switch::after { background: #cfcdc5; }

  .frow.on .switch { background: var(--accent); }
  .frow.on .switch::after { transform: translateX(11px); }
  [data-theme="dark"] .frow.on .switch::after { background: var(--accent-fg); }

  .side-foot {
    font-size: 10.5px;
    color: var(--text3);
    padding: 2px 4px;
    flex-shrink: 0;
  }

  .side-foot .hlink { font-size: 10.5px; padding: 0; }

  /* ===== History ===== */
  .hist { padding: 10px 12px; display: flex; flex-direction: column; gap: 7px; flex-shrink: 0; }

  .hist-hd {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    font-size: 11.5px;
    font-weight: 700;
  }

  .hist-item {
    display: block;
    width: 100%;
    font-family: "SF Mono", ui-monospace, Menlo, monospace;
    font-size: 10.5px;
    color: var(--text2);
    background: none;
    border: none;
    padding: 2px 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    cursor: pointer;
    text-align: left;
  }

  .hist-item:hover { color: var(--text); }
  .hist-item .t { color: var(--text3); }
  .hist-empty { font-size: 10.5px; color: var(--text3); }

  /* ===== Columns ===== */
  .cols {
    flex: 1;
    min-width: 0;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    min-height: 0;
  }

  .col {
    display: flex;
    flex-direction: column;
    padding: 14px 16px;
    gap: 10px;
    min-height: 0;
    min-width: 0;
  }

  .col.focus-ring:focus-within { border-color: var(--text3); }
  .col.out { box-shadow: var(--shadow); }

  .col-hd {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
    flex-shrink: 0;
  }

  .col-title { font-size: 12px; font-weight: 700; white-space: nowrap; }

  .col-sub { font-weight: 400; font-size: 10.5px; color: var(--text2); white-space: nowrap; }

  .col-stats {
    font-family: "SF Mono", ui-monospace, Menlo, monospace;
    font-size: 10.5px;
    color: var(--text3);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  textarea, .diff-view {
    flex: 1;
    min-height: 0;
    width: 100%;
    background: none;
    border: none;
    outline: none;
    resize: none;
    color: var(--text);
    font-family: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
    font-size: 12.5px;
    line-height: 1.9;
    overflow-y: auto;
  }

  textarea::placeholder { color: var(--text3); }

  .diff-view {
    white-space: pre-wrap;
    word-break: break-all;
    cursor: text;
  }

  .diff-view del {
    color: var(--del-fg);
    background: var(--del-bg);
    text-decoration: line-through;
    border-radius: 2px;
    padding: 0 1px;
  }

  .diff-view ins {
    color: var(--ins-fg);
    background: var(--ins-bg);
    text-decoration: none;
    border-radius: 2px;
    padding: 0 1px;
  }

  .col-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
    flex-wrap: wrap;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 8px 16px;
    border-radius: 7px;
    border: none;
    font-family: inherit;
    font-size: 12px;
    cursor: pointer;
    white-space: nowrap;
    flex-shrink: 0;
    color: var(--text);
    background: none;
  }

  .btn:active { transform: scale(0.97); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; pointer-events: none; }

  .btn.primary {
    background: var(--accent);
    color: var(--accent-fg);
    font-weight: 600;
    font-size: 12.5px;
    padding: 8px 22px;
  }

  .btn.primary:hover { opacity: 0.88; }

  .btn.outline { border: 1px solid var(--track-off); background: var(--surface); }
  .btn.outline:hover { border-color: var(--text3); }

  .btn.ghost { color: var(--text2); }
  .btn.ghost:hover { color: var(--del-fg); background: var(--del-bg); }

  .removed-line {
    font-size: 10.5px;
    color: var(--text3);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex-shrink: 0;
  }

  /* ===== Toast ===== */
  .toast {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(-80px);
    background: var(--accent);
    color: var(--accent-fg);
    padding: 9px 20px;
    border-radius: 8px;
    font-size: 12.5px;
    font-weight: 500;
    z-index: 200;
    box-shadow: 0 8px 24px -8px rgba(0,0,0,0.35);
    transition: transform 0.3s cubic-bezier(0.34, 1.2, 0.64, 1);
    pointer-events: none;
    max-width: 90vw;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.warning { background: var(--orange); color: #fff; }

  /* ===== Focus / selection / scrollbar ===== */
  .btn:focus-visible, .frow:focus-visible, .group-hd:focus-visible, .hlink:focus-visible, .hist-item:focus-visible {
    outline: 2px solid var(--text2);
    outline-offset: 2px;
  }

  ::selection { background: rgba(140, 130, 100, 0.25); }

  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--track-off); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text3); }

  /* ===== Responsive ===== */
  @media (max-width: 1000px) {
    body { overflow: auto; }
    .app { height: auto; min-height: 100%; }
    .main { flex-direction: column; }
    aside {
      width: auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      overflow: visible;
    }
    .hist { grid-column: 1 / -1; }
    .side-foot { grid-column: 1 / -1; }
    .cols { flex: none; }
    textarea, .diff-view { min-height: 180px; flex: none; height: 180px; }
    .diff-view { height: auto; max-height: 320px; min-height: 0; }
  }

  @media (max-width: 720px) {
    .app { padding: 0 14px; }
    .tagline { display: none; }
    .cols { grid-template-columns: 1fr; }
    aside { grid-template-columns: 1fr; }
    .frow { padding: 11px 10px; font-size: 13px; }
    .switch { width: 32px; height: 19px; border-radius: 10px; }
    .switch::after { width: 15px; height: 15px; border-radius: 8px; }
    .frow.on .switch::after { transform: translateX(13px); }
    .group-hd { padding: 12px; font-size: 12.5px; }
    .btn { padding: 11px 16px; font-size: 13px; }
    .btn.primary { flex: 1; }
    .btn.outline { flex: 1; }
    .col-actions .col-stats { display: none; }
  }
</style>
</head>
<body>

<div class="app">
  <header class="hd">
    <span class="logo">SuperCopy</span>
    <span class="tagline">清理追踪参数 · 展开短链 · 提取口令</span>
    <span class="spacer"></span>
    <button class="hlink" id="themeToggle">暗色</button>
  </header>

  <div class="main">
    <aside>
      <section class="card group" data-group="text">
        <button class="group-hd" aria-expanded="true">文本过滤
          <span class="group-meta"><span class="gcount">0 项</span><span class="chev">▾</span></span>
        </button>
        <div class="group-body">
          <button class="frow" data-filter="whitespace">压缩空格<span class="switch"></span></button>
          <button class="frow" data-filter="emoji">去除 Emoji<span class="switch"></span></button>
          <button class="frow" data-filter="chinese">去除中文<span class="switch"></span></button>
          <button class="frow" data-filter="numbers">去除数字<span class="switch"></span></button>
          <button class="frow" data-filter="punctuation">去除标点<span class="switch"></span></button>
          <button class="frow" data-filter="special">去除特殊符号<span class="switch"></span></button>
          <button class="frow" data-filter="weibo">去除微博格式<span class="switch"></span></button>
        </div>
      </section>

      <section class="card group" data-group="link">
        <button class="group-hd" aria-expanded="true">链接处理
          <span class="group-meta"><span class="gcount">0 项</span><span class="chev">▾</span></span>
        </button>
        <div class="group-body">
          <button class="frow" data-filter="tracking">去除追踪标记<span class="switch"></span></button>
          <button class="frow" data-filter="expand">展开短链<span class="switch"></span></button>
          <button class="frow" data-filter="extracturl">口令提取<span class="switch"></span></button>
          <button class="frow" data-filter="bvav">BV⇄AV 互转<span class="switch"></span></button>
          <button class="frow" data-filter="urldecode">URL 解码<span class="switch"></span></button>
        </div>
      </section>

      <section class="card hist" id="histCard">
        <div class="hist-hd">最近处理 <button class="hlink" id="histClear">清空</button></div>
        <div id="histList"><div class="hist-empty">复制结果后自动记录</div></div>
      </section>

      <div class="side-foot"><span id="activeCount">0 项已启用</span> · <button class="hlink" id="allOff">全部关闭</button></div>
    </aside>

    <div class="cols">
      <section class="card col focus-ring">
        <div class="col-hd">
          <span class="col-title">输入</span>
          <span class="col-stats" id="inStats">0 字 · 0 行</span>
        </div>
        <textarea id="input" placeholder="在此粘贴你的文本...

快捷键：
  Ctrl+Shift+V  从剪贴板粘贴
  Ctrl+Enter    复制结果"></textarea>
        <div class="col-actions">
          <button class="btn outline" id="pasteBtn">从剪贴板粘贴</button>
          <button class="btn ghost" id="clearBtn">清空</button>
        </div>
      </section>

      <section class="card col out">
        <div class="col-hd">
          <span class="col-title">输出 <span class="col-sub" id="diffInfo"></span></span>
          <button class="hlink" id="diffToggle">显示改动 ✓</button>
        </div>
        <textarea id="output" placeholder="处理后的文本将显示在这里..." readonly></textarea>
        <div class="diff-view mono" id="diffView" hidden></div>
        <div class="col-actions">
          <button class="btn primary" id="copyBtn">复制结果</button>
          <button class="btn outline" id="swapBtn">设为输入</button>
          <span class="spacer"></span>
          <span class="col-stats" id="outStats"></span>
        </div>
        <div class="removed-line" id="removedLine" hidden></div>
      </section>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="tracking-rules.js"></script>
<script>
(function() {
  // --- DOM ---
  const $ = id => document.getElementById(id);
  const $input = $('input'), $output = $('output'), $diffView = $('diffView');
  const $copyBtn = $('copyBtn'), $clearBtn = $('clearBtn'), $pasteBtn = $('pasteBtn'), $swapBtn = $('swapBtn');
  const $toast = $('toast'), $diffInfo = $('diffInfo'), $diffToggle = $('diffToggle');
  const $inStats = $('inStats'), $outStats = $('outStats'), $removedLine = $('removedLine');
  const $histList = $('histList'), $histClear = $('histClear');
  const $activeCount = $('activeCount');

  // --- Storage helpers ---
  const store = {
    get(k, fallback) { try { const v = localStorage.getItem(k); return v === null ? fallback : JSON.parse(v); } catch { return fallback; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  };

  // --- State ---
  const activeFilters = new Set(store.get('supercopy-filters', []));
  let diffMode = store.get('supercopy-diff', true);
  let history = store.get('supercopy-history', []);
  let lastRaw = '', lastResult = '';

  // --- Regex patterns ---
  const PATTERNS = {
    chinese:     /[\u4e00-\u9fff\u3400-\u4dbf\uf900-\ufaff\u3000-\u303f\uff00-\uffef\u2e80-\u2eff\u31c0-\u31ef\u3200-\u32ff\u3300-\u33ff\ufe10-\ufe1f\ufe30-\ufe4f]/g,
    emoji:       /[\u{1F600}-\u{1F64F}\u{1F300}-\u{1F5FF}\u{1F680}-\u{1F6FF}\u{1F1E0}-\u{1F1FF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}\u{1F900}-\u{1F9FF}\u{1FA00}-\u{1FA6F}\u{1FA70}-\u{1FAFF}\u{2300}-\u{23FF}\u{2B50}\u{2B55}\u{2934}\u{2935}\u{25AA}\u{25AB}\u{25B6}\u{25C0}\u{25FB}-\u{25FE}\u{200D}\u{FE0F}\u{20E3}\u{1F004}\u{1F0CF}\u{1F18E}]/gu,
    numbers:     /\d+/g,
    punctuation: /[\p{P}\p{S}]/gu,
    whitespace:  /[^\S\n]{2,}/g,
    special:     /[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?`~]/g,
    weibo:       /\[(?:\/?cp|图片|表情|视频|链接|语音|音乐|投票)\]/g,
  };

  const FILTER_LABELS = {
    chinese: '中文', emoji: 'Emoji', numbers: '数字', punctuation: '标点',
    whitespace: '多余空格', special: '特殊符号', tracking: '追踪参数',
    expand: '展开短链', bvav: 'BV⇄AV', extracturl: '口令提取',
    urldecode: 'URL解码', weibo: '微博格式',
  };

  // --- Bilibili BV ↔ AV conversion ---
  const BV_TABLE = 'fZodR9XQDSUm21yCkr6zBqiveYah8bt4xsWpHnJE7jL5VG3guMTKNPAwcF';
  const BV_S = [11, 10, 3, 8, 4, 6];
  const BV_XOR = 177451812;
  const BV_ADD = 8728348608;
  const BV_TEMPLATE = [...'BV1  4 1 7  '];

  function bvToAv(bv) {
    let sum = 0;
    for (let i = 0; i < 6; i++) {
      const idx = BV_TABLE.indexOf(bv[BV_S[i]]);
      if (idx === -1) return null;
      sum += idx * Math.pow(58, i);
    }
    const av = (sum - BV_ADD) ^ BV_XOR;
    if (av <= 0) return null;
    return 'av' + av;
  }

  function avToBv(av) {
    const num = parseInt(av.replace(/av/i, ''));
    if (isNaN(num) || num <= 0) return null;
    let n = (num ^ BV_XOR) + BV_ADD;
    const result = [...BV_TEMPLATE];
    for (let i = 0; i < 6; i++) {
      result[BV_S[i]] = BV_TABLE[Math.floor(n / Math.pow(58, i)) % 58];
    }
    return result.join('');
  }

  function convertBvAv(text) {
    const convertedFromBv = new Set();
    let result = text.replace(/BV1[a-zA-Z0-9]{9}/gi, m => {
      if (m.length !== 12) return m;
      const av = bvToAv(m);
      if (av) convertedFromBv.add(av.toLowerCase());
      return av || m;
    });
    result = result.replace(/\bav(\d+)\b/gi, m => {
      if (convertedFromBv.has(m.toLowerCase())) return m;
      const bv = avToBv(m);
      return bv || m;
    });
    return result;
  }

  // --- URL regexes（排除全角标点，分享文案里 URL 后常紧跟 ，。） 等）---
  const URL_REGEX = /(?:https?:\/\/|https?%3A%2F%2F)[^\s<>^`\[\]，。、；：！？（）【】《》「」『』“”‘’…]+/gi;
  const ANY_URL_REGEX = /(?:https?:\/\/|https?%3A%2F%2F|www\.|[a-z0-9][-a-z0-9]*\.[a-z]{2,}\/)[^\s<>^`\[\]，。、；：！？（）【】《》「」『』“”‘’…]+/gi;

  // 展开结果缓存：url → { to, blocked }
  const expandCache = new Map();

  async function expandShortUrls(text) {
    const matches = text.match(URL_REGEX);
    if (!matches) return { text, blockedUrls: [] };

    function normalizeUrl(url) {
      const m = url.match(/^(https?:\/\/www\.xiaohongshu\.com)\/discovery\/item\/([a-f0-9]+)(\?.*)?$/i);
      if (m) return m[1] + '/explore/' + m[2] + (m[3] || '');
      return url;
    }

    const uniqueUrls = [...new Set(matches)];
    const expansions = [];
    const blockedUrls = [];
    const toFetch = [];
    for (const u of uniqueUrls) {
      const cached = expandCache.get(u);
      if (cached) {
        if (cached.blocked) blockedUrls.push(u);
        else if (cached.to) expansions.push({ from: u, to: cached.to });
      } else {
        toFetch.push(u);
      }
    }

    for (let i = 0; i < toFetch.length; i += 2) {
      const batch = toFetch.slice(i, i + 2);
      const results = await Promise.all(batch.map(async (u) => {
        try {
          const apiUrl = '/expand?url=' + encodeURIComponent(u);
          const resp = await fetch(apiUrl, { signal: AbortSignal.timeout(15000) });
          if (resp.ok) {
            const data = await resp.json();
            if (data.expanded && data.expanded !== u) {
              const to = normalizeUrl(data.expanded);
              expandCache.set(u, { to, blocked: false });
              return { from: u, to };
            }
            const blocked = !!(data.note && data.note.toLowerCase().includes('block'));
            expandCache.set(u, { to: null, blocked });
            if (blocked) blockedUrls.push(u);
          }
        } catch (e) {
          console.warn('短链展开失败:', u, e.message);
        }
        return null;
      }));
      expansions.push(...results.filter(Boolean));
    }

    let result = text;
    expansions.sort((a, b) => b.from.length - a.from.length);
    for (const e of expansions) {
      result = result.split(e.from).join(e.to);
    }

    if (blockedUrls.length > 0 && expansions.length === 0) {
      result = result.trim();
      if (result) result += '\n\n';
      result += '⚠ 以下短链因反爬验证未能展开（请手动在浏览器中打开）：\n' + blockedUrls.join('\n');
    }

    return { text: result, blockedUrls };
  }

  // --- URL decode ---
  function urlDecodeText(text) {
    try {
      let prev = text;
      for (let i = 0; i < 3; i++) {
        let decoded;
        try {
          decoded = decodeURIComponent(prev);
        } catch {
          decoded = prev.replace(/%[0-9A-Fa-f]{2}/g, m => {
            try { return decodeURIComponent(m); } catch { return m; }
          });
        }
        if (decoded === prev) break;
        prev = decoded;
      }
      return prev;
    } catch {
      return text;
    }
  }

  // --- Process pipeline（序号守卫：丢弃过期的异步结果）---
  let processSeq = 0;

  async function process() {
    const seq = ++processSeq;
    const raw = $input.value;
    let result = raw;
    const removedParts = [];

    const LINK_KEYS = ['extracturl', 'expand', 'tracking', 'bvav'];
    const linkKeys = LINK_KEYS.filter(k => activeFilters.has(k));
    const textKeys = [...activeFilters].filter(k => !LINK_KEYS.includes(k) && k !== 'urldecode');

    for (const key of linkKeys) {
      if (key === 'extracturl') {
        const urls = result.match(ANY_URL_REGEX);
        if (urls && urls.length > 0) {
          result = [...new Set(urls)].join('\n');
          removedParts.push(`口令提取 ${urls.length} 链接`);
        }
      } else if (key === 'expand') {
        const before = result;
        const expandResult = await expandShortUrls(result);
        if (seq !== processSeq) return;
        result = expandResult.text;
        if (before !== result) removedParts.push('短链已展开');
        if (expandResult.blockedUrls.length > 0) removedParts.push(`反爬拦截 ${expandResult.blockedUrls.length} 条`);
      } else if (key === 'tracking') {
        const before = result;
        result = TrackingRules.strip(result);
        if (before !== result) removedParts.push(`追踪参数 −${before.length - result.length}`);
      } else if (key === 'bvav') {
        const before = result;
        result = convertBvAv(result);
        if (before !== result) removedParts.push('BV⇄AV 已转换');
      }
    }

    // 文本过滤前先把 URL 换成占位符保护起来（占位符只含私有区字符 + 小写字母）
    const savedUrls = [];
    if (textKeys.length > 0) {
      result = result.replace(ANY_URL_REGEX, m => {
        const token = '\uE000' + String(savedUrls.length).replace(/\d/g, d => 'abcdefghij'[+d]) + '\uE001';
        savedUrls.push(m);
        return token;
      });
    }

    for (const key of textKeys) {
      if (key === 'whitespace') {
        const before = result;
        result = result.replace(PATTERNS.whitespace, ' ');
        result = result.replace(/\n{3,}/g, '\n\n');
        result = result.replace(/^\s+|\s+$/g, '');
        if (before !== result) removedParts.push('多余空格');
      } else {
        const pattern = PATTERNS[key];
        if (!pattern) continue;
        const matches = result.match(pattern);
        if (matches && matches.length > 0) {
          removedParts.push(`${FILTER_LABELS[key]} ×${matches.length}`);
        }
        result = result.replace(pattern, '');
      }
    }

    if (savedUrls.length > 0) {
      result = result.replace(/\uE000([a-j]+)\uE001/g, (m, code) => {
        const idx = Number([...code].map(c => 'abcdefghij'.indexOf(c)).join(''));
        return savedUrls[idx] !== undefined ? savedUrls[idx] : m;
      });
    }

    // URL 解码放最后，避免破坏 query 结构
    if (activeFilters.has('urldecode')) {
      const before = result;
      result = urlDecodeText(result);
      if (before !== result) removedParts.push('URL解码');
    }

    lastRaw = raw;
    lastResult = result;
    $output.value = result;
    render(raw, result, removedParts);
  }

  // --- Grapheme counting ---
  const graphemeSegmenter = (typeof Intl !== 'undefined' && Intl.Segmenter) ? new Intl.Segmenter() : null;
  function countGraphemes(s) {
    if (graphemeSegmenter) return [...graphemeSegmenter.segment(s)].length;
    return [...s].length;
  }

  // --- Character diff（公共前后缀裁剪 + 有界 LCS，超限退化为整段替换）---
  function diffParts(a, b) {
    if (a === b) return [[0, a]];
    const A = Array.from(a), B = Array.from(b);
    let p = 0;
    while (p < A.length && p < B.length && A[p] === B[p]) p++;
    let s = 0;
    while (s < A.length - p && s < B.length - p && A[A.length - 1 - s] === B[B.length - 1 - s]) s++;
    const prefix = A.slice(0, p).join('');
    const suffix = s ? A.slice(-s).join('') : '';
    const aM = A.slice(p, A.length - s), bM = B.slice(p, B.length - s);
    const parts = [];
    if (prefix) parts.push([0, prefix]);
    if (aM.length * bM.length > 250000) {
      if (aM.length) parts.push([-1, aM.join('')]);
      if (bM.length) parts.push([1, bM.join('')]);
    } else if (aM.length === 0) {
      if (bM.length) parts.push([1, bM.join('')]);
    } else if (bM.length === 0) {
      parts.push([-1, aM.join('')]);
    } else {
      // LCS DP
      const n = aM.length, m = bM.length;
      const dp = new Uint32Array((n + 1) * (m + 1));
      for (let i = n - 1; i >= 0; i--) {
        for (let j = m - 1; j >= 0; j--) {
          dp[i * (m + 1) + j] = aM[i] === bM[j]
            ? dp[(i + 1) * (m + 1) + j + 1] + 1
            : Math.max(dp[(i + 1) * (m + 1) + j], dp[i * (m + 1) + j + 1]);
        }
      }
      let i = 0, j = 0;
      while (i < n && j < m) {
        if (aM[i] === bM[j]) { parts.push([0, aM[i]]); i++; j++; }
        else if (dp[(i + 1) * (m + 1) + j] >= dp[i * (m + 1) + j + 1]) { parts.push([-1, aM[i]]); i++; }
        else { parts.push([1, bM[j]]); j++; }
      }
      while (i < n) { parts.push([-1, aM[i]]); i++; }
      while (j < m) { parts.push([1, bM[j]]); j++; }
    }
    if (suffix) parts.push([0, suffix]);
    // 合并相邻同类段
    const merged = [];
    for (const [op, txt] of parts) {
      if (merged.length && merged[merged.length - 1][0] === op) merged[merged.length - 1][1] += txt;
      else merged.push([op, txt]);
    }
    return merged;
  }

  function renderDiff(raw, result) {
    $diffView.textContent = '';
    if (!raw && !result) {
      const ph = document.createElement('span');
      ph.style.color = 'var(--text3)';
      ph.textContent = '处理后的文本将显示在这里...';
      $diffView.appendChild(ph);
      return;
    }
    const parts = diffParts(raw, result);
    const frag = document.createDocumentFragment();
    for (const [op, txt] of parts) {
      if (op === 0) frag.appendChild(document.createTextNode(txt));
      else {
        const el = document.createElement(op === -1 ? 'del' : 'ins');
        el.textContent = txt;
        frag.appendChild(el);
      }
    }
    $diffView.appendChild(frag);
  }

  // --- Render ---
  function statsText(t) {
    let s = `${t.length} 字 · ${t ? t.split('\n').length : 0} 行`;
    return s;
  }

  function render(raw, result, removedParts) {
    // input stats（中文/Emoji 有则追加）
    let inS = statsText(raw);
    const cn = raw.match(PATTERNS.chinese);
    if (cn) inS += ` · 中文 ${cn.join('').length}`;
    const em = raw.match(PATTERNS.emoji);
    if (em) inS += ` · Emoji ${countGraphemes(em.join(''))}`;
    $inStats.textContent = inS;
    $outStats.textContent = result ? statsText(result) : '';

    // diff info in title
    const delta = result.length - raw.length;
    if (raw !== result && delta !== 0) {
      $diffInfo.textContent = delta < 0 ? `已去除 ${-delta} 字符` : `已增加 ${delta} 字符`;
      $diffInfo.style.color = delta < 0 ? 'var(--green)' : 'var(--orange)';
    } else if (raw !== result) {
      $diffInfo.textContent = '已转换';
      $diffInfo.style.color = 'var(--text2)';
    } else {
      $diffInfo.textContent = '';
    }

    // removed summary line
    if (removedParts && removedParts.length > 0) {
      $removedLine.hidden = false;
      $removedLine.textContent = removedParts.join(' · ');
    } else {
      $removedLine.hidden = true;
    }

    applyDiffMode();
  }

  function applyDiffMode() {
    const showDiff = diffMode;
    $diffToggle.textContent = showDiff ? '显示改动 ✓' : '显示改动';
    $diffView.hidden = !showDiff;
    $output.style.display = showDiff ? 'none' : '';
    if (showDiff) renderDiff(lastRaw, lastResult);
  }

  $diffToggle.addEventListener('click', () => {
    diffMode = !diffMode;
    store.set('supercopy-diff', diffMode);
    applyDiffMode();
  });

  // --- Filters UI ---
  const frows = [...document.querySelectorAll('.frow')];

  function syncFilterUI() {
    frows.forEach(b => b.classList.toggle('on', activeFilters.has(b.dataset.filter)));
    document.querySelectorAll('.group').forEach(g => {
      const keys = [...g.querySelectorAll('.frow')].map(b => b.dataset.filter);
      const n = keys.filter(k => activeFilters.has(k)).length;
      g.querySelector('.gcount').textContent = `${n} 项`;
    });
    $activeCount.textContent = `${activeFilters.size} 项已启用`;
    store.set('supercopy-filters', [...activeFilters]);
  }

  frows.forEach(b => b.addEventListener('click', () => {
    const k = b.dataset.filter;
    activeFilters.has(k) ? activeFilters.delete(k) : activeFilters.add(k);
    syncFilterUI();
    process();
  }));

  $('allOff').addEventListener('click', () => {
    activeFilters.clear();
    syncFilterUI();
    process();
  });

  // --- Group collapse ---
  const collapsed = new Set(store.get('supercopy-groups', []));
  document.querySelectorAll('.group').forEach(g => {
    const name = g.dataset.group;
    if (collapsed.has(name)) g.classList.add('collapsed');
    const hd = g.querySelector('.group-hd');
    hd.setAttribute('aria-expanded', String(!collapsed.has(name)));
    hd.addEventListener('click', () => {
      g.classList.toggle('collapsed');
      const isCollapsed = g.classList.contains('collapsed');
      hd.setAttribute('aria-expanded', String(!isCollapsed));
      isCollapsed ? collapsed.add(name) : collapsed.delete(name);
      store.set('supercopy-groups', [...collapsed]);
    });
  });

  // --- History ---
  function timeAgo(t) {
    const d = Date.now() - t;
    if (d < 60000) return '刚刚';
    if (d < 3600000) return Math.floor(d / 60000) + '分钟前';
    if (d < 86400000) return Math.floor(d / 3600000) + '小时前';
    if (d < 172800000) return '昨天';
    return new Date(t).toLocaleDateString('zh-CN', { month: 'numeric', day: 'numeric' });
  }

  function histLabel(entry) {
    const url = entry.o.match(URL_REGEX);
    let base = url ? url[0].replace(/^https?:\/\/(www\.)?/, '') : entry.o.replace(/\s+/g, ' ').trim();
    return base.slice(0, 36) || '（空）';
  }

  function renderHistory() {
    $histList.textContent = '';
    if (history.length === 0) {
      const d = document.createElement('div');
      d.className = 'hist-empty';
      d.textContent = '复制结果后自动记录';
      $histList.appendChild(d);
      return;
    }
    history.slice(0, 8).forEach(entry => {
      const b = document.createElement('button');
      b.className = 'hist-item';
      b.title = '点击恢复到输入框';
      b.textContent = histLabel(entry) + ' ';
      const t = document.createElement('span');
      t.className = 't';
      t.textContent = timeAgo(entry.t);
      b.appendChild(t);
      b.addEventListener('click', () => {
        $input.value = entry.i;
        process();
        showToast('已恢复历史记录');
      });
      $histList.appendChild(b);
    });
  }

  function pushHistory(input, output) {
    if (!output.trim()) return;
    if (history.length && history[0].o === output) return;
    history.unshift({ i: input, o: output, t: Date.now() });
    history = history.slice(0, 20);
    store.set('supercopy-history', history);
    renderHistory();
  }

  $histClear.addEventListener('click', () => {
    history = [];
    store.set('supercopy-history', history);
    renderHistory();
    showToast('已清空历史');
  });

  // --- Input ---
  let debounceTimer;
  $input.addEventListener('input', () => {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(process, 150);
  });

  // --- Copy ---
  $copyBtn.addEventListener('click', async () => {
    const text = $output.value;
    if (!text) {
      showToast('没有可复制的内容', 'warning');
      return;
    }
    const done = () => {
      $copyBtn.textContent = '✓ 已复制';
      showToast('已复制到剪贴板');
      pushHistory($input.value, text);
      setTimeout(() => { $copyBtn.textContent = '复制结果'; }, 1600);
    };
    try {
      await navigator.clipboard.writeText(text);
      done();
    } catch {
      $output.style.display = '';
      $output.select();
      document.execCommand('copy');
      applyDiffMode();
      done();
    }
  });

  // --- Paste ---
  $pasteBtn.addEventListener('click', async () => {
    try {
      const text = await navigator.clipboard.readText();
      if (text) {
        $input.value = text;
        process();
        showToast('已从剪贴板粘贴');
      }
    } catch {
      showToast('无法读取剪贴板，请手动粘贴', 'warning');
      $input.focus();
    }
  });

  // --- Swap ---
  $swapBtn.addEventListener('click', () => {
    if (!$output.value.trim()) return;
    $input.value = $output.value;
    process();
    showToast('已将处理结果设为输入');
  });

  // --- Clear ---
  $clearBtn.addEventListener('click', () => {
    $input.value = '';
    process();
    $input.focus();
  });

  // --- Toast ---
  let toastTimer;
  function showToast(msg, type) {
    clearTimeout(toastTimer);
    $toast.textContent = msg;
    $toast.className = 'toast show' + (type === 'warning' ? ' warning' : '');
    toastTimer = setTimeout(() => $toast.classList.remove('show'), 2000);
  }

  // --- Keyboard shortcuts ---
  document.addEventListener('keydown', e => {
    if (e.ctrlKey && e.shiftKey && e.key === 'V') {
      e.preventDefault();
      $pasteBtn.click();
    }
    if (e.ctrlKey && !e.shiftKey && e.key === 'Enter') {
      e.preventDefault();
      $copyBtn.click();
    }
  });

  // --- Theme ---
  const themeToggle = $('themeToggle');
  const THEME_KEY = 'supercopy-theme';

  function setTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    try { localStorage.setItem(THEME_KEY, theme); } catch {}
    themeToggle.textContent = theme === 'light' ? '暗色' : '亮色';
  }

  let savedTheme;
  try { savedTheme = localStorage.getItem(THEME_KEY); } catch {}
  setTheme(savedTheme === 'dark' ? 'dark' : 'light');

  themeToggle.addEventListener('click', () => {
    const current = document.documentElement.getAttribute('data-theme') || 'light';
    setTheme(current === 'light' ? 'dark' : 'light');
  });

  // --- Init ---
  syncFilterUI();
  renderHistory();
  process();
})();
</script>
</body>
</html>
